services:
  mysql:
    image: mysql:latest
    restart: unless-stopped
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: mysql123
      MYSQL_DATABASE: mysql
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql123
    volumes:
      - dbdata:/var/lib/mysql

  redis:
    image: redis
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - redisdata:/data

  webserver:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - 80:80
    links:
      - redis
      - mysql

volumes:
  redisdata:
  dbdata:
